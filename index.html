<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://jtbsgdvthamexevgtpaz.supabase.co https://api.anthropic.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitPro">
<meta name="application-name" content="FitPro">
<title>FitPro</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/app.css">

<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo" id="logo"></div>
      <div>
        <h1>FitPro</h1>
        <p id="subtitle"></p>
      </div>
    </div>
    <div class="top-actions">
      <button class="timer-pill hidden" id="timer-pill" type="button" aria-label="Dinlenme sayacını aç"></button>
      <button class="icon-btn" id="timer-btn" type="button" aria-label="Dinlenme sayacı"></button>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <nav class="nav" role="tablist" aria-label="Bölümler">
    <button type="button" role="tab" data-tab="workout">Antrenman</button>
    <button type="button" role="tab" data-tab="nutrition">Beslenme</button>
    <button type="button" role="tab" data-tab="program">Program</button>
    <button type="button" role="tab" data-tab="stats">Analiz</button>
    <button type="button" role="tab" data-tab="profile">Profil</button>
  </nav>
</div>
<noscript>Bu uygulama JavaScript gerektirir.</noscript>
<script type="module" src="js/app.js"></script>
